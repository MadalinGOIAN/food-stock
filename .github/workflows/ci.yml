name: CI

on:
    push:
        branches: [main, staging, dev]
    pull_request:
        branches: [main, staging, dev]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with: 
                go-version: '1.25'
            
            - name: Vet
              run: |
                go vet ./...
                go vet -tags=integration ./...

            - name: Check format
              run: |
                unformatted="$(gofmt -l .)"
                if [ -n "$unformatted" ]; then
                  echo "The following files are not formatted:"
                  echo "$unformatted"
                  exit 1
                fi

            - name: Build
              run: |
                go build ./...

            - name: Unit Tests
              run: go test ./... -v
            
            - uses: supabase/setup-cli@v1
              with:
                version: latest
            
            - name: Start Supabase
              run: supabase start
            
            - name: Integration Tests
              env:
                DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
                SUPABASE_URL: http://127.0.0.1:54321
              run: |
                set -euo pipefail
                export SUPABASE_ANON_KEY="$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2 | tr -d '\"')"
                test -n "$SUPABASE_ANON_KEY" || { echo "ANON_KEY not resolved"; exit 1; }
                curl -fsS -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health" \
                  || { echo "GoTrue not healthy"; supabase status; exit 1; }
                go test -tags=integration ./... -v -timeout 60s
