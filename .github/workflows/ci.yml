name: CI

on:
    push:
        branches: [main, staging]
    pull_request:
        branches: [main, staging]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with: 
                go-version: '1.25'
            
            - name: Vet
              run: go vet ./...

            - name: Build
              run: go build ./...

            - name: Test
              run: go test ./...
