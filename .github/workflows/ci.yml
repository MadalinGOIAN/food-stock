name: CI

on:
    push:
        branches: [main, staging, dev]
    pull_request:
        branches: [main, staging, dev]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: postgres
            ports:
              - 5432:5432
            options: >-
              --health-cmd pg_isready
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with: 
                go-version: '1.25'
            
            - name: Vet
              run: go vet ./...

            - name: Build
              run: go build ./...

            - name: Unit Tests
              run: go test ./... -v
            
            - name: Apply migrations
              env:
                PGPASSWORD: postgres
              run: psql -h localhost -U postgres -f internal/db/migrations/000.db.sql
            
            - name: Integration Tests
              env:
                DATABASE_URL: postgres://postgres:postgres@localhost:5432/food_stock?sslmode=disable
              run: go test -tags=integration ./... -v
